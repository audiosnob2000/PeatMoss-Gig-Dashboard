@media print{
  /* body itself keeps its normal light-gray background even though its
     children are hidden below (visibility:hidden only hides the elements
     it's applied to, not body) — any page area the print content doesn't
     physically cover shows that gray through as a smudgy, uneven-looking
     patch. Forcing it white here is what actually fixes that, regardless
     of how tall the print content ends up being. */
  body{background:#fff}
  body *{visibility:hidden}
  .schedule-print-area,.schedule-print-area *{visibility:visible}
  .schedule-print-area{position:fixed;top:0;left:0;width:100%;margin:0}
  .no-print{display:none!important}
  /* Calendar-grid share view fills the whole printable page instead of
     sizing to its on-screen modal width. Deliberately NOT using a named
     @page rule + the "page" property to auto-select landscape orientation
     here — that's a non-standard CSS Paged Media feature Safari doesn't
     support, and it's the single biggest structural difference between
     this view's print path and the plain list view's (which does print,
     just with its own separate WebKit quirk on repeat attempts). Safari's
     print pipeline appeared to hang on it rather than just ignoring it.
     Orientation is picked by the user in their own print dialog instead —
     less automatic, but doesn't risk breaking print entirely. */
  .schedule-print-cal{padding:0.5in!important}
  /* Sized for the worst case of 6 calendar rows in a month. Landscape has
     a shorter page (8.5in vs 11in tall), so its cells need to be smaller
     or a 6-row month overflows the single fixed-position page and the
     bottom row gets cut off instead of wrapping to a second page. */
  .schedule-print-cal .sched-cal-grid>div{min-height:1.15in!important}
  .schedule-print-cal.landscape .sched-cal-grid>div{min-height:0.85in!important}
  /* The song viewer's "stage mode" is dark on screen, but that's a screen
     reading aid, not a print choice — printing it as-is would waste ink and
     make the chords hard to read against a black page. Force it back to
     plain ink-on-paper regardless of the on-screen theme. */
  .song-viewer-print,.song-viewer-print *{background:#fff!important;color:#000!important}
}

// Converts any hex color into a full theme (primary/mid/light/pale/accent)
// by keeping its hue but walking a fixed lightness ramp, so custom colors
// and presets both come out looking like the same family of palette.
function hexToHsl(hex){
  hex=hex.replace('#','');
  const r=parseInt(hex.substring(0,2),16)/255;
  const g=parseInt(hex.substring(2,4),16)/255;
  const b=parseInt(hex.substring(4,6),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h=0,s=0;const l=(max+min)/2;
  const d=max-min;
  if(d!==0){
    s=d/(1-Math.abs(2*l-1));
    if(max===r)h=((g-b)/d)%6;
    else if(max===g)h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;if(h<0)h+=360;
  }
  return {h,s:s*100,l:l*100};
}
function hslToHex(h,s,l){
  s/=100;l/=100;
  const c=(1-Math.abs(2*l-1))*s;
  const x=c*(1-Math.abs((h/60)%2-1));
  const m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;b=0;}
  else if(h<120){r=x;g=c;b=0;}
  else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;}
  else if(h<300){r=x;g=0;b=c;}
  else {r=c;g=0;b=x;}
  const toHex=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');
  return '#'+toHex(r)+toHex(g)+toHex(b);
}

// Chord transposition for typed/text charts. Chart text is free-form (no
// ChordPro-style markup), so there's no structural way to tell a chord
// token from a lyric word on its own — "A" is both a valid chord and a
// common word. The heuristic: only transpose a line where EVERY token on
// it looks like a chord (or a bar separator like "|"); a real lyric line
// almost never has that property, since actual words essentially never
// all start with A–G. This matches the chords-on-their-own-line
// convention the app's own "add song" placeholder already teaches.
const NOTE_SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NOTE_TO_INDEX={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const CHORD_TOKEN_RE=/^([A-G][#b]?)([a-z0-9()+\-]*)(?:\/([A-G][#b]?)([a-z0-9()+\-]*))?$/;
const BAR_SEPARATOR_RE=/^[|/%.\-–—]+$/;
function transposeChordToken(token,steps){
  const m=token.match(CHORD_TOKEN_RE);
  if(!m)return token;
  const [,root,suffix,slashRoot,slashSuffix]=m;
  const preferFlat=root.includes('b')||(slashRoot&&slashRoot.includes('b'));
  const shiftNote=note=>{
    const idx=NOTE_TO_INDEX[note];
    if(idx===undefined)return note;
    const shifted=((idx+steps)%12+12)%12;
    return (preferFlat?NOTE_FLAT:NOTE_SHARP)[shifted];
  };
  let out=shiftNote(root)+suffix;
  if(slashRoot)out+='/'+shiftNote(slashRoot)+(slashSuffix||'');
  return out;
}
function lineIsChordLine(line){
  const tokens=line.trim().split(/\s+/).filter(Boolean);
  if(!tokens.length)return false;
  return tokens.every(t=>CHORD_TOKEN_RE.test(t)||BAR_SEPARATOR_RE.test(t));
}
function transposeChart(text,steps){
  if(!steps||!text)return text;
  return text.split('\n').map(line=>
    lineIsChordLine(line)?line.replace(/\S+/g,tok=>transposeChordToken(tok,steps)):line

}

// Tries a native app deep link, only falling back to the web URL if the tab
// never got backgrounded (i.e. the app link didn't actually open anything).
function openWithFallback(appUrl,webUrl){
  let didHide=false;
  const onHide=()=>{ if(document.hidden) didHide=true; };
  document.addEventListener('visibilitychange',onHide);
  window.location=appUrl;
  setTimeout(()=>{
    document.removeEventListener('visibilitychange',onHide);
    if(!didHide) window.open(webUrl,'_blank');
  },1000);
}

// Opens Google Maps app on iOS directly
function openMaps(venue,location){
  const dest=encodeURIComponent((venue||'')+(location?' '+location:''));
  openWithFallback('comgooglemaps://?daddr='+dest+'&directionsmode=driving','https://www.google.com/maps/dir/?api=1&destination='+dest);
}

// Steps the header band-name font size down as the name gets longer, so it
// keeps to one centered line instead of wrapping — most bands fit at full
// size; only unusually long names actually shrink.
function bandNameFontSize(name){
  const len=(name||'').length;
  if(len<=16)return 26;
  if(len<=22)return 24;
  if(len<=28)return 21;
  if(len<=36)return 18;
  if(len<=46)return 15;
  return 13;
}

// Keep this display clean: just the venue itself (not "@ Venue" add-ons or
// descriptive suffixes), just town/state (not a full address or business
// name), and just the start time (no end time, no on-the-hour ":00").
// Weddings/private events keep their full venue text since "Wedding @ Venue"
// is the meaningful part there, not filler.
function scheduleShortVenue(g){
  if(g.type==='wedding'||g.type==='private event') return g.venue;
  const v=g.venue||'';
  const m=v.match(/^(.*?)(?:,| @ | – | -)/);
  let short=(m?m[1]:v).trim();
  short=short.replace(/\s+concert series$/i,'').trim();
  return short||v.trim();
}
function scheduleShortLocation(loc){
  if(!loc) return loc;
  const parts=loc.split(',').map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1) return loc;
  // Find the "STATE" or "STATE ZIP" segment (a 2-letter code, optionally
  // followed by a zip) rather than blindly taking the last two parts — real
  // addresses often have zip/country after it, which would otherwise push
  // the actual town out of view.
  const stateIdx=parts.findIndex((p,i)=>i>0&&/^[A-Za-z]{2}(\s|$)/.test(p));
  if(stateIdx<1) return parts.slice(0,2).join(', ');
  const town=parts[stateIdx-1];
  const state=parts[stateIdx].replace(/\d+/g,'').trim();
  return state?`${town}, ${state}`:town;
}
function scheduleShortTime(t){
  if(!t) return '';
  const parts=t.split(/[–-]/).map(s=>s.trim());
  let start=parts[0];
  const ampm=(parts[parts.length-1]||'').match(/AM|PM/i);
  if(ampm&&!/AM|PM/i.test(start)) start+=' '+ampm[0].toUpperCase();
  return start.replace(/:00(?=\s?(AM|PM))/i,'').trim();
}

// One file input covers "Photos" and "Files" — the browser/OS picker
// already offers both sources for the same <input type=file>. What we do
// with the result depends on what got picked:
//  - an image: downscale before storing as a data URL. A straight-from-
//    phone photo can be several MB, and every app setting/gig/checklist
//    lives in this same localStorage origin, so one oversized image could
//    blow the quota for everything else, not just this upload.
//  - an HTML file: read as text and render it in an iframe later — safer
//    and simpler than trying to open a data: URL in a new tab, which
//    modern Chrome blocks as a top-level navigation.
//  - anything else: keep the raw file as a data URL, offered as a
//    download in the viewer since we can't meaningfully preview it.
// Shared across every "upload a photo or file" flow in the app (setlists,
// stage plot, per-item setlist replace) so this handling only lives once.
function processUploadedFile(file,onSuccess,onError){
  if(file.type.startsWith('image/')){
    const reader=new FileReader();
    reader.onerror=()=>onError('Could not read that photo. Try again, or pick a different one.');
    reader.onload=ev=>{
      const img=new Image();
      img.onerror=()=>{
        // Some photo formats (e.g. HEIC straight from an iPhone camera)
        // can't be decoded into a <canvas> in every browser. Rather than
        // fail silently, fall back to saving the original file as-is —
        // it won't preview inline, but it's saved and downloadable.
        onSuccess({type:'file',content:ev.target.result,fileName:file.name});
      };
      img.onload=()=>{
        const maxDim=1280;
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){const scale=maxDim/Math.max(w,h);w=Math.round(w*scale);h=Math.round(h*scale);}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        onSuccess({type:'image',content:canvas.toDataURL('image/jpeg',0.8),fileName:file.name});
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  } else if(file.type==='text/html'||/\.html?$/i.test(file.name)){
    const reader=new FileReader();
    reader.onerror=()=>onError('Could not read that file. Try again, or pick a different one.');
    reader.onload=ev=>onSuccess({type:'html',content:ev.target.result,fileName:file.name});
    reader.readAsText(file);
  } else {
    const reader=new FileReader();
    reader.onerror=()=>onError('Could not read that file. Try again, or pick a different one.');
    reader.onload=ev=>onSuccess({type:'file',content:ev.target.result,fileName:file.name});
    reader.readAsDataURL(file);
  }
}

function Badge({status}){
  // Confirmed is the default, common-case status — showing a badge for it
  // on every gig was just noise. The badge is more useful as a flag for the
  // exception: something ISN'T confirmed yet, or got cancelled.
  if(status==='confirmed')return null;
  // 'pending' was folded into 'hold' (they meant the same thing in
  // practice) — old gigs saved with status:'pending' still render sensibly
  // instead of crashing on a removed STATUS_STYLE key.
  const s=STATUS_STYLE[status]||STATUS_STYLE.hold;
  return e('span',{className:'badge',style:{background:s.bg,color:s.color}},s.label);
}

// Module-level (not per-component) so reopening the same gig's popup during
// this session doesn't re-fetch — venue+date forecasts don't change minute
// to minute anyway. Geocoding is cached separately by location alone, since
// multiple gigs often share the same venue across different dates.
const WEATHER_CACHE={};
const GEOCODE_CACHE={};
function weatherIconFor(code){
  if(code===0)return '☀️';
  if(code===1||code===2)return '🌤️';
  if(code===3)return '☁️';
  if(code===45||code===48)return '🌫️';
  if(code>=51&&code<=67)return '🌧️';
  if(code>=71&&code<=77)return '❄️';
  if(code>=80&&code<=82)return '🌦️';
  if(code>=95)return '⛈️';
  return '⛅';
}
// Forecast row for the gig popup — Open-Meteo only covers a useful range a
// bit over a week out, so gigs further away (or missing a location) simply
// render nothing here, same as a failed fetch. No loading placeholder or
// error state, to avoid a flash of "Weather —" on every popup open.
function GigWeatherRow({gig,compact}){
  const [weather,setWeather]=useState(null);
  // Surfaced on screen (not just console) since this is a client-side-only
  // app with no server logs to check — a short reason code here is the only
  // way to diagnose a real-device failure without guessing blind again.
  const [failReason,setFailReason]=useState(null);
  useEffect(()=>{
    setWeather(null);
    setFailReason(null);
    if(!gig.location||!gig.date)return;
    const days=Math.floor((new Date(gig.date+'T00:00:00')-new Date(new Date().toDateString()))/86400000);
    if(days<0||days>10)return;
    const cacheKey=gig.location+'|'+gig.date;
    if(WEATHER_CACHE[cacheKey]){setWeather(WEATHER_CACHE[cacheKey]);return;}
    // Location is often typed as "Venue Name, Town, ST" rather than just
    // "Town, ST" — scheduleShortLocation already knows how to find the
    // state-abbreviation segment and keep only the town right before it,
    // discarding whatever's in front of it (venue name or not).
    const geoQuery=scheduleShortLocation(gig.location)||gig.location;
    let cancelled=false;
    (async()=>{
      try{
        let coords=GEOCODE_CACHE[geoQuery];
        if(!coords){
          // Open-Meteo's geocoder first — fast, generous rate limit, meant
          // to pair with the weather API — but it only covers a curated
          // list of larger/well-known places, so it misses a lot of small
          // towns real venues are actually in. Nominatim (OpenStreetMap)
          // has far more complete small-town coverage, so it's the fallback
          // when Open-Meteo comes up empty, even though its usage policy
          // caps client-side use at 1 request/second — that's fine here
          // since it's only hit on a miss, not on every lookup.
          const geoRes=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(geoQuery)}&count=1`);
          const geoData=geoRes.ok?await geoRes.json():null;
          const r=geoData&&geoData.results&&geoData.results[0];
          if(r){
            coords={lat:r.latitude,lon:r.longitude};
          }else{
            const nomRes=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(geoQuery)}&format=json&limit=1`);
            if(!nomRes.ok){if(!cancelled)setFailReason(`geocode HTTP ${nomRes.status}`);return;}
            const nomData=await nomRes.json();
            const nr=nomData&&nomData[0];
            if(!nr){if(!cancelled)setFailReason(`no geocode match for "${geoQuery}"`);return;}
            coords={lat:nr.lat,lon:nr.lon};
          }
          if(cancelled)return;
          GEOCODE_CACHE[geoQuery]=coords;
        }
        const {lat,lon}=coords;
        const wRes=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&temperature_unit=fahrenheit&timezone=auto&start_date=${gig.date}&end_date=${gig.date}`);
        if(!wRes.ok){if(!cancelled)setFailReason(`forecast HTTP ${wRes.status}`);return;}
        const wData=await wRes.json();
        const d=wData&&wData.daily;
        if(!d||!d.time||!d.time.length){if(!cancelled)setFailReason('forecast returned no data for this date');return;}
        const result={hi:Math.round(d.temperature_2m_max[0]),lo:Math.round(d.temperature_2m_min[0]),rain:Math.round(d.precipitation_probability_max[0]),code:d.weathercode[0]};
        WEATHER_CACHE[cacheKey]=result;
        if(!cancelled)setWeather(result);
      }catch(err){
        if(!cancelled)setFailReason('fetch failed: '+(err&&err.message||'unknown error'));
      }
    })();
    return ()=>{cancelled=true;};
  },[gig.location,gig.date]);
  if(compact){
    // Inline form for the popup's bold "quick facts" line — no label, no
    // row layout, and a fetch failure just omits weather from the line
    // entirely rather than showing an error where date/time are.
    if(!weather)return null;
    return e('span',{style:{flexShrink:0}},'  ·  '+weatherIconFor(weather.code)+' '+weather.hi+'°/'+weather.lo+'° · '+weather.rain+'% rain');
  }
  if(!weather&&!failReason)return null;
  if(failReason)return e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
    e('span',{style:{fontSize:13,color:'#6b7280'}},'Weather'),
    e('span',{style:{fontSize:11,color:'#9ca3af',textAlign:'right',maxWidth:200}},'Unavailable — '+failReason)
  );
  return e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
    e('span',{style:{fontSize:13,color:'#6b7280'}},'Weather'),
    e('span',{style:{fontSize:13,fontWeight:500,display:'flex',alignItems:'center',gap:6}},
      e('span',{style:{fontSize:16}},weatherIconFor(weather.code)),
      `${weather.hi}° / ${weather.lo}° · ${weather.rain}% rain`
    )
  );
}

const SWIPE_DELETE_WIDTH=72;
function SwipeableGigRow({g,bg,border,tc,onEdit,onDelete,onMap,pastUnpaid}){
  const [tx,setTx]=useState(0);
  const dragRef=useRef({startX:0,startTx:0,dragging:false,moved:false});
  const onPointerDown=ev=>{
    dragRef.current={startX:ev.clientX,startTx:tx,dragging:true,moved:false};
    if(ev.currentTarget.setPointerCapture)ev.currentTarget.setPointerCapture(ev.pointerId);
  };
  const onPointerMove=ev=>{
    const d=dragRef.current;
    if(!d.dragging)return;
    const delta=ev.clientX-d.startX;
    if(Math.abs(delta)>4)d.moved=true;
    setTx(Math.max(-SWIPE_DELETE_WIDTH,Math.min(0,d.startTx+delta)));
  };
  const onPointerUp=()=>{
    const d=dragRef.current;
    if(!d.dragging)return;
    d.dragging=false;
    setTx(prev=>prev<-SWIPE_DELETE_WIDTH/2?-SWIPE_DELETE_WIDTH:0);
  };
  return e('div',{style:{position:'relative',overflow:'hidden',borderBottom:border}},
    e('div',{onClick:()=>{if(window.confirm('Delete "'+g.venue+'"?'))onDelete(g.id);},
      style:{position:'absolute',top:0,right:0,bottom:0,width:SWIPE_DELETE_WIDTH,background:'#DC2626',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:600,cursor:'pointer'}},'Delete'),
    e('div',{
      onPointerDown,onPointerMove,onPointerUp,onPointerCancel:onPointerUp,
      style:{position:'relative',background:bg,padding:'12px 14px',display:'flex',alignItems:'center',gap:12,transform:`translateX(${tx}px)`,transition:dragRef.current.dragging?'none':'transform 0.2s ease',touchAction:'pan-y'}
    },
      // Opacity lives on this inner wrapper, not the row above — the row
      // itself must stay fully opaque so its solid background keeps hiding
      // the swipe-to-delete panel underneath; fading the row directly let
      // the red Delete panel show through faded rows.
      e('div',{style:{display:'flex',alignItems:'center',gap:12,width:'100%',opacity:pastUnpaid?0.45:1}},
        e('div',{style:{background:tc.bg,borderRadius:8,padding:'8px 0',width:44,flexShrink:0,textAlign:'center'}},
          e('div',{style:{fontSize:16,fontWeight:500,color:tc.color,lineHeight:1}},g.date.slice(8)),
          e('div',{style:{fontSize:10,color:tc.color,marginTop:2}},MONTHS[parseInt(g.date.slice(5,7))-1])
        ),
        e('div',{style:{flex:1,minWidth:0}},
          e('div',{style:{fontWeight:500,fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},(g.selfPA?'🔊 ':'')+g.venue),
          e('div',{style:{fontSize:12,color:'#6b7280',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},scheduleShortLocation(g.location)+(g.time?' · '+g.time:'')),
          e('div',{style:{display:'flex',gap:6,marginTop:5,flexWrap:'wrap',alignItems:'center'}},
            e('span',{className:'badge',style:{background:tc.bg,color:tc.color}},g.type),
            e(Badge,{status:g.status}),
            pastUnpaid&&e('span',{style:{fontSize:10,padding:'2px 8px',borderRadius:99,fontWeight:600,background:'#FEE2E2',color:'#B91C1C',display:'inline-flex',alignItems:'center',gap:3}},'💲 Unpaid'),
            g.location&&e('button',{onClick:ev=>{ev.stopPropagation();onMap();},
              style:{fontSize:11,padding:'2px 8px',borderRadius:99,background:'#E0EFFE',color:'#1D4ED8',fontWeight:500,border:'none',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:3}},'📍 Map')
          )
        ),
        e('button',{onClick:onEdit,style:{fontSize:12,padding:'5px 12px',flexShrink:0}},'Edit')
      )
    )
  );
}

// Short relative-time label ("2h ago", "just now") for the band message's
// timestamp — reused by both the banner and the compose modal's meta line.
function timeAgo(iso){
  if(!iso)return '';
  const ms=Date.now()-new Date(iso).getTime();
  const mins=Math.floor(ms/60000);
  if(mins<1)return 'just now';
  if(mins<60)return mins+'m ago';
  const hrs=Math.floor(mins/60);
  if(hrs<24)return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}

function BandMessageBannerStack({messages,dismissedIds,onEdit,onDismiss}){
  const visible=(messages||[]).filter(m=>dismissedIds.indexOf(m.id)===-1);
  if(!visible.length)return null;
  return e('div',{style:{marginBottom:visible.length?'0.4rem':0}},
    visible.map(m=>e(BandMessageBanner,{key:m.id,message:m,onEdit,onDismiss}))
  );
}

// Compose/edit/delete card for a single band message. Each message is its
// own Firestore doc (bandMessages collection) — passing message=null opens
// a blank compose box for a new post; passing an existing message edits
// just that one in place without touching any other active message.
function BandMessageModal({message,onSave,onDelete,onClose}){
  const [text,setText]=useState(message&&message.text||'');
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState('');
  const [slow,setSlow]=useState(false);
  useEffect(()=>{
    if(!saving){setSlow(false);return;}
    const t=setTimeout(()=>setSlow(true),5000);
    return ()=>clearTimeout(t);
  },[saving]);
  const hasExisting=!!message;
  const submit=()=>{
    if(!text.trim())return;
    setSaving(true);setError('');
    onSave(text.trim()).then(onClose).catch(err=>{setSaving(false);setError((err&&err.message)||'Could not post — check your connection and try again.');});
  };
  const submitDelete=()=>{
    setSaving(true);setError('');
    onDelete().then(onClose).catch(err=>{setSaving(false);setError((err&&err.message)||'Could not delete — check your connection and try again.');});
  };
  return e('div',{onClick:onClose,className:'overlay'},
    e('div',{onClick:ev=>ev.stopPropagation(),className:'modal',style:{maxWidth:360}},
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
        e('div',{style:{fontSize:16,fontWeight:700}},'Band message'),
        e('button',{onClick:onClose,style:{border:'none',background:'none',fontSize:18,color:'#9ca3af',cursor:'pointer',padding:'0 4px'}},'×')
      ),
      e('textarea',{value:text,maxLength:100,rows:3,autoFocus:true,
        placeholder:'Type something for the whole band to see…',
        onChange:ev=>setText(ev.target.value),
        style:{width:'100%',resize:'none',fontFamily:'inherit',fontSize:13,padding:'9px 10px',border:'1px solid #d1d5db',borderRadius:8,color:'#111827'}
      }),
      e('div',{style:{fontSize:10.5,color:'#9ca3af',marginTop:5}},
        text.length+'/100'+(hasExisting?' · posted '+timeAgo(message.postedAt):' · visible to everyone until deleted')
      ),
      error&&e('div',{style:{fontSize:11.5,color:'#B91C1C',marginTop:8}},'⚠ '+error),
      slow&&!error&&e('div',{style:{fontSize:11.5,color:'#9ca3af',marginTop:8}},'Still trying — this can take a moment on a slow connection.'),
      e('div',{style:{display:'flex',gap:8,marginTop:14}},
        e('button',{onClick:submit,disabled:!text.trim()||saving,
          style:{flex:1,padding:'9px 0',borderRadius:9,border:'none',background:(text.trim()&&!saving)?'#1D9E75':'#a7d9c6',color:'#fff',fontWeight:600,fontSize:13,cursor:(text.trim()&&!saving)?'pointer':'default'}},
          saving?'Saving…':(hasExisting?'Update':'Post to band')),
        hasExisting&&e('button',{onClick:submitDelete,disabled:saving,
          style:{flex:'0 0 auto',padding:'9px 14px',borderRadius:9,border:'none',background:'#FEE2E2',color:'#B91C1C',fontWeight:600,fontSize:13,cursor:saving?'default':'pointer'}},
          'Delete')
      )
    )
  );
}

// Draws the calendar-grid share view directly onto a canvas using only
// plain fillRect/strokeRect/fillText calls — deliberately NOT the
// DOM-to-SVG-to-canvas trick some libraries use, since that path has known
// rendering gaps specifically in Safari/WebKit, which is exactly the
// engine this needs to work reliably on.
function drawScheduleCalendarCanvas({bandName,monthLabel,cells,gigsByDate,dateKeyFor,bw,theme,orientation,showUnpaid,unpaidGigIds}){
  const landscape=orientation==='landscape';
  const width=landscape?1150:900,height=landscape?900:1150;
  const canvas=document.createElement('canvas');
  canvas.width=width;canvas.height=height;
  const ctx=canvas.getContext('2d');
  const font='-apple-system, Helvetica, Arial, sans-serif';

  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,width,height);

  ctx.textAlign='center';
  ctx.fillStyle='#111827';
  ctx.font='bold 32px '+font;
  ctx.fillText(bandName,width/2,56);

  ctx.fillStyle=bw?'#111827':theme.primary;
  ctx.font='600 18px '+font;
  ctx.fillText(monthLabel.toUpperCase(),width/2,86);

  const marginX=36,gridTop=130,gridBottom=height-60,cols=7;
  const gridWidth=width-marginX*2;
  const colWidth=gridWidth/cols;
  const rows=Math.ceil(cells.length/cols);
  const rowHeight=(gridBottom-gridTop)/rows;

  ctx.font='600 13px '+font;
  ctx.fillStyle='#6b7280';
  DAYS.forEach((d,i)=>ctx.fillText(d,marginX+colWidth*i+colWidth/2,gridTop-10));

  cells.forEach((day,i)=>{
    if(!day)return;
    const col=i%7,row=Math.floor(i/7);
    const x=marginX+col*colWidth,y=gridTop+row*rowHeight;
    const dayGigs=gigsByDate[dateKeyFor(day)]||[];
    const hasGig=dayGigs.length>0;
    const isWedding=hasGig&&dayGigs[0].type==='wedding';

    // Empty-cell borders are deliberately a solid, clearly visible gray
    // (not a faint hairline) — this is meant to be read as an actual
    // calendar grid at a glance, booked or not, especially once printed.
    // Gig-cell styling is untouched here; only the empty-day gray itself
    // was darkened a step so the grid reads less washed out on paper.
    ctx.fillStyle=hasGig&&!bw?(isWedding?'#EEEDFE':theme.pale):'#ffffff';
    ctx.fillRect(x+2,y+2,colWidth-4,rowHeight-4);
    ctx.lineWidth=hasGig&&bw?2.5:1.5;
    ctx.strokeStyle=hasGig?(bw?'#111827':(isWedding?'#AFA9EC':theme.light)):'#6b7280';
    ctx.strokeRect(x+2,y+2,colWidth-4,rowHeight-4);

    ctx.textAlign='left';
    ctx.font=(hasGig?'700 ':'600 ')+'14px '+font;
    ctx.fillStyle=hasGig?(bw?'#111827':(isWedding?'#534AB7':theme.primary)):'#374151';
    ctx.fillText(String(day),x+10,y+22);

    if(hasGig){
      ctx.font='600 11px '+font;
      ctx.fillStyle=bw?'#111827':(isWedding?'#534AB7':theme.primary);
      let text=scheduleShortVenue(dayGigs[0]);
      const maxWidth=colWidth-18;
      if(ctx.measureText(text).width>maxWidth){
        while(text.length>1&&ctx.measureText(text+'…').width>maxWidth)text=text.slice(0,-1);
        text+='…';
      }
      ctx.fillText(text,x+10,y+40);

      const gigTime=scheduleShortTime(dayGigs[0].time);
      if(gigTime||dayGigs[0].selfPA){
        ctx.font='500 10px '+font;
        ctx.fillStyle=bw?'#4b5563':'#6b7280';
        ctx.fillText(gigTime+(dayGigs[0].selfPA?' 🔊':''),x+10,y+54);
      }
    }

    if(showUnpaid&&dayGigs.some(g=>(unpaidGigIds||[]).includes(g.id))){
      const bx=x+colWidth-13,by=y+11,br=6;
      ctx.beginPath();
      ctx.arc(bx,by,br,0,Math.PI*2);
      ctx.fillStyle='#DC2626';
      ctx.fill();
      ctx.textAlign='center';
      ctx.font='bold 8px '+font;
      ctx.fillStyle='#ffffff';
      ctx.fillText('$',bx,by+3);
      ctx.textAlign='left';
    }
  });

  ctx.textAlign='center';
  ctx.font='10px '+font;
  ctx.fillStyle='#9ca3af';
  ctx.fillText('MADE WITH GIG DASHBOARD',width/2,height-24);

  return canvas;
}

// Real fix for the Calendar-view print bug on iOS: instead of trying to
// coax window.print() into working (it structurally can't, in a standalone
// app, and Safari's print pipeline choked on the calendar view specifically
// even in a browser tab), render the calendar to an image and hand it to
// the OS share sheet, which DOES work in the installed app — AirPrint is
// one of the built-in options there, so this reaches an actual printer
// without ever leaving the app. Returns true if the share sheet was
// successfully invoked (including the user cancelling it, which still
// counts as "handled" — only a real failure falls back to old behavior).
async function tryShareScheduleCalendarImage(args){
  try{
    if(!(navigator.canShare&&typeof File!=='undefined'))return false;
    const canvas=drawScheduleCalendarCanvas(args);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!blob)return false;
    const safeName=(args.bandName+' - '+args.monthLabel).replace(/[\/\\:*?"<>|]/g,'-');
    const file=new File([blob],safeName+'.png',{type:'image/png'});
    if(!navigator.canShare({files:[file]}))return false;
    try{
      await navigator.share({files:[file],title:args.bandName+' — '+args.monthLabel});
    }catch(err){
      if(!(err&&err.name==='AbortError'))return false;
    }
    return true;
  }catch(err){
    return false;
  }
}

function HomeAddressInput({settings,setSettings,theme}){
  const inputRef=useRef(null);
  const [locating,setLocating]=useState(false);
  const [showOpenInSafari,setShowOpenInSafari]=useState(false);
  useEffect(()=>{if(inputRef.current)inputRef.current.value=settings.homeAddress||'';},[]);
  const save=()=>{
    if(inputRef.current){
      const val=inputRef.current.value.trim();
      setSettings(s=>({...s,homeAddress:val}));
    }
  };
  const useMyLocation=()=>{
    if(!navigator.geolocation){alert('GPS not available.');return;}
    setLocating(true);
    // iOS standalone home-screen web apps run in a stripped-down WKWebView
    // that doesn't reliably support the geolocation permission handshake —
    // a known Apple/WebKit limitation, not something fixable from here. It
    // works fine in a normal Safari tab, so offer to open there instead.
    const isIOSStandalone=window.navigator.standalone===true;
    const GPS_ERROR_MESSAGES={
      1:isIOSStandalone
        ?'Location doesn\'t work reliably in the installed app on iPhone — that\'s an Apple limitation, not a setting you can fix. Use the "Open in Safari" link below to set your address there, or just type it in.'
        :'Location access is turned off for this app. Enable it in your device or browser settings, then try again — or just type your address.',
      2:'Couldn\'t pin down your location right now. Try again outdoors or somewhere with a clearer signal, or type your address.',
      3:'Location took too long to respond. Try again, or type your address.'
    };
    // A single request — the earlier "permission denied" bug came from an
    // automatic SECOND getCurrentPosition call that wasn't tied to the
    // user's tap (Safari silently denies those), not from high accuracy
    // itself. So: real GPS, one call only, no retry.
    navigator.geolocation.getCurrentPosition(async pos=>{
      try{
        // Free reverse geocode — no API key needed. addressdetails=1 gives
        // structured fields so we can build a short "123 Main St, City, ST
        // ZIP" address instead of Nominatim's display_name, which strings
        // together every administrative layer (town, county, country).
        const res=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&addressdetails=1`);
        const data=await res.json();
        const a=data&&data.address;
        if(a){
          const street=[a.house_number,a.road].filter(Boolean).join(' ');
          const city=a.city||a.town||a.village||a.hamlet||a.suburb||'';
          const state=US_STATE_ABBR[a.state]||a.state||'';
          const cityStateZip=[city,[state,a.postcode].filter(Boolean).join(' ')].filter(Boolean).join(', ');
          const addr=[street,cityStateZip].filter(Boolean).join(', ')||data.display_name;
          if(inputRef.current) inputRef.current.value=addr;
          setSettings(s=>({...s,homeAddress:addr}));
        } else if(data&&data.display_name){
          const addr=data.display_name;
          if(inputRef.current) inputRef.current.value=addr;
          setSettings(s=>({...s,homeAddress:addr}));
        } else {
          alert('Could not get address. Try typing it manually.');
        }
      }catch(err){
        alert('Could not get address. Try typing it manually.');
      }
      setLocating(false);
    },err=>{
      alert(GPS_ERROR_MESSAGES[err.code]||'GPS unavailable. Try typing your address.');
      // window.open() is just as unreliable as geolocation itself inside an
      // iOS standalone app — there's no browser chrome for it to open a tab
      // in. A real <a> tag the user taps directly is what actually works,
      // so show one instead of trying to script the hand-off to Safari.
      if(err.code===1&&isIOSStandalone) setShowOpenInSafari(true);
      setLocating(false);
    },{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
  };
  return e('div',{style:{padding:'12px 14px'}},
    e('div',{style:{fontSize:14,color:'#111827',marginBottom:4}},'Home address'),
    e('div',{style:{fontSize:12,color:'#9ca3af',marginBottom:10}},'Used for navigate home after gigs'),
    e('input',{ref:inputRef,defaultValue:settings.homeAddress||'',onBlur:save,placeholder:'123 Main St, Rocky Point, NY',style:{padding:'8px 10px',border:'1px solid #d1d5db',borderRadius:8,fontSize:14,width:'100%',marginBottom:8}}),
    e('div',{style:{display:'flex',gap:8}},
      e('button',{onClick:useMyLocation,disabled:locating,style:{flex:1,padding:'8px 0',borderRadius:8,border:`1px solid ${theme.mid}`,color:theme.mid,background:'#fff',cursor:'pointer',fontSize:13,fontWeight:500}},locating?'📍 Locating...':'📍 Use my location'),
      e('button',{onClick:save,style:{padding:'8px 16px',borderRadius:8,border:'none',background:theme.mid,color:'#fff',cursor:'pointer',fontSize:13,fontWeight:500}},'Save')
    ),
    // A real link the user taps directly — window.open() can't reliably
    // hand off to Safari from inside an installed iOS home-screen app.
    // The x-safari- URL scheme prefix forces iOS to open Safari specifically
    // rather than just re-navigating within this same standalone context,
    // which is what a plain same-URL target="_blank" link was silently
    // doing (no visible effect, since the URL never actually changed).
    showOpenInSafari&&e('a',{href:'x-safari-'+window.location.href,target:'_blank',rel:'noopener',
      style:{display:'block',textAlign:'center',marginTop:8,fontSize:12.5,color:theme.mid,fontWeight:500,textDecoration:'underline'}},
      '↗ Open in Safari to use your location')
  );
}

function StagePlotSection({settings,setSettings,theme}){

// Reads a previously-saved Google sign-in token for instant first paint.
// If it's past expiry we still return it — the mount-time effect in App()
// will silently refresh it via the stored refresh token (held server-side
// by the Cloud Function) rather than treating an expired access token as
// "signed out".
function loadStoredGoogleAuth(){
  try{
    const s=localStorage.getItem('pmtf_google_auth');
    if(!s) return {token:null,expiresAt:null};
    const parsed=JSON.parse(s);
    if(parsed.token&&parsed.expiresAt) return parsed;
    return {token:null,expiresAt:null};
  }catch{return {token:null,expiresAt:null};}
}
// A stable per-device ID (not tied to any Google identity) that the Cloud
// Function uses to look up this device's stored refresh token. Generated
// once and kept in localStorage indefinitely.
function getDeviceId(){
  try{
    let id=localStorage.getItem('pmtf_device_id');
    if(!id){
      id=(crypto.randomUUID?crypto.randomUUID():'dev-'+Date.now()+'-'+Math.random().toString(36).slice(2));
      localStorage.setItem('pmtf_device_id',id);
    }
    return id;
  }catch{return 'dev-'+Date.now();}
}

      const remoteIds=new Set(remoteGigs.map(g=>String(g.id)));
      const removedIds=new Set([...prevRemoteIds].filter(id=>!remoteIds.has(id)));
      prevRemoteIds.clear();
      remoteIds.forEach(id=>prevRemoteIds.add(id));
      setGigs(prev=>{
        let next=prev;
        if(removedIds.size) next=next.filter(g=>!(removedIds.has(String(g.id))&&!g.fromCalendar));
        const localCalKeys=new Set(next.filter(g=>g.fromCalendar).map(dedupeKey));
        const byId=new Map(next.map(g=>[String(g.id),g]));
        remoteGigs.forEach(rg=>{
          const existing=byId.get(String(rg.id));
          if(existing){
            if(!existing.fromCalendar){
              byId.set(String(rg.id),{...rg,id:existing.id});
            }else{
              // Calendar stays authoritative for date/venue/location/time on
              // a calendar-sourced gig (that's the whole point of the guard
              // above), but notes/type/status/selfPA are edited here in the
              // app, not on Calendar — those need to actually reach every
              // device live via Firestore, the same as any other gig, or a
              // note typed on one phone is stuck there forever.
              byId.set(String(rg.id),{...existing,notes:rg.notes,type:rg.type,status:rg.status,selfPA:rg.selfPA});
            }
          }
          else if(!localCalKeys.has(dedupeKey(rg))) byId.set(String(rg.id),rg);
        });
        return Array.from(byId.values());
      });
    },()=>{});
    return unsub;
  },[]);
  useEffect(()=>{
    try{
      if(googleAccessToken&&googleTokenExpiresAt) localStorage.setItem('pmtf_google_auth',JSON.stringify({token:googleAccessToken,expiresAt:googleTokenExpiresAt}));
      else localStorage.removeItem('pmtf_google_auth');
    }catch{}
  },[googleAccessToken,googleTokenExpiresAt]);

  // Back up this device's mileage log to Firestore so it survives local
  // storage getting cleared (the same class of loss that hit gigs/setlists
  // before they got synced). Mileage is personal — every trip carries this
  // device's id and each client filters down to just its own, so nobody
  // else's trips show up here even though the collection itself is shared.
  useEffect(()=>{
    const deviceId=getDeviceId();
    let migrating=false;
    const unsub=db.collection('mileageTrips').onSnapshot(snap=>{
      const mine=snap.docs.filter(d=>d.data().deviceId===deviceId);
      if(mine.length===0&&!migrating&&mileageLog.length>0&&!localStorage.getItem('pmtf_mileage_migrated')){
        migrating=true;
        const withIds=mileageLog.map(t=>t.id?t:{...t,id:'trip'+Date.now()+Math.random().toString(36).slice(2,8)});
        const batch=db.batch();
        withIds.forEach(t=>{const{id,...rest}=t;batch.set(db.collection('mileageTrips').doc(id),{...rest,deviceId});});
        batch.commit().then(()=>{
          try{localStorage.setItem('pmtf_mileage_migrated','1');}catch{}
          setMileageLog(withIds);
        }).catch(()=>{migrating=false;});
        return;
      }
      setMileageLog(mine.map(d=>{const{deviceId,...rest}=d.data();return{id:d.id,...rest};}));
    },()=>{});
    return unsub;
  },[]);

  // Back up this device's checklist (members + their items) to Firestore,
  // same reasoning and pattern as mileage above — personal, not shared
  // band-wide, stored as one doc per device rather than per-item since the
  // whole checklist is small and always written/read as a unit.
  useEffect(()=>{
    const deviceId=getDeviceId();
    let migrating=false;
    const unsub=db.collection('checklists').doc(deviceId).onSnapshot(doc=>{
      if(!doc.exists&&!migrating&&members.length>0&&!localStorage.getItem('pmtf_members_migrated')){
        migrating=true;
        db.collection('checklists').doc(deviceId).set({members}).then(()=>{
          try{localStorage.setItem('pmtf_members_migrated','1');}catch{}
          checklistHydratedRef.current=true;
        }).catch(()=>{migrating=false;});
        return;
      }
      if(doc.exists) setMembers(doc.data().members||[]);
      checklistHydratedRef.current=true;
    },()=>{checklistHydratedRef.current=true;});
    return unsub;
  },[]);

  // Back up this device's unpaid-gig marks to Firestore, same per-device
  // pattern as the checklist above — which gigs you've flagged unpaid is
  // personal bookkeeping, not something that should broadcast to the band.
  useEffect(()=>{
    const deviceId=getDeviceId();
    let migrating=false;
    const unsub=db.collection('unpaidGigs').doc(deviceId).onSnapshot(doc=>{
      if(!doc.exists&&!migrating&&unpaidGigIds.length>0&&!localStorage.getItem('pmtf_unpaid_gigs_migrated')){
        migrating=true;
        db.collection('unpaidGigs').doc(deviceId).set({gigIds:unpaidGigIds}).then(()=>{
          try{localStorage.setItem('pmtf_unpaid_gigs_migrated','1');}catch{}
          unpaidHydratedRef.current=true;
        }).catch(()=>{migrating=false;});
        return;
      }
      if(doc.exists) setUnpaidGigIds(doc.data().gigIds||[]);
      unpaidHydratedRef.current=true;
    },()=>{unpaidHydratedRef.current=true;});
    return unsub;
  },[]);

  // Keep ref in sync with state so GPS callback can read it
  useEffect(()=>{ trackingRef.current=trackingMiles; },[trackingMiles]);

  // Pick up the authorization code Google hands back as a URL query param
  // after a sign-in redirect (used instead of a popup — popups can't return
  // to a standalone/home-screen web app on iOS, they just get stranded on
  // Google's page with no opener to report back to). The code itself is
  // useless without the client secret, so it's handed to the Cloud Function
  // to exchange for tokens — that's also where the long-lived refresh token
  // ends up stored, never in the browser.
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const code=params.get('code');
    const err=params.get('error');
    const cleanUrl=()=>window.history.replaceState(null,'',window.location.pathname);
    const reopenIfNeeded=()=>{
      if(sessionStorage.getItem('pmtf_reopen_settings')==='1'){
        setShowSettings(true);
        sessionStorage.removeItem('pmtf_reopen_settings');
      }
    };
    if(code){
      fetch(FUNCTIONS_BASE_URL+'/exchangeGoogleAuthCode',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code,deviceId:getDeviceId(),redirectUri:GOOGLE_REDIRECT_URI})
      }).then(r=>r.json().then(data=>({ok:r.ok,data}))).then(({ok,data})=>{
        if(ok){
          setGoogleAccessToken(data.accessToken);
          setGoogleTokenExpiresAt(Date.now()+data.expiresIn*1000);
          setGoogleAuthError('');
        } else {
          setGoogleAuthError('Google sign-in failed: '+(data.error||'unknown error'));
        }
      }).catch(()=>setGoogleAuthError('Google sign-in failed: could not reach the server.'))
        .finally(()=>{reopenIfNeeded();cleanUrl();});
    } else if(err){
      setGoogleAuthError('Google sign-in failed: '+err);
      reopenIfNeeded();
      cleanUrl();
    }
  },[]);
  // Silently refresh the Google access token — on mount if it's already
  // expired (e.g. app reopened after a long time away), and periodically
  // in the background so it never actually expires mid-use. Falls back to
  // clearing the sign-in state (prompting the user to reconnect) only if
  // the stored refresh token itself is no longer valid.
  const refreshGoogleToken=useCallback(()=>{
    return fetch(FUNCTIONS_BASE_URL+'/refreshGoogleAuthToken',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({deviceId:getDeviceId()})
    }).then(r=>r.json().then(data=>({ok:r.ok,data}))).then(({ok,data})=>{
      if(ok){
        setGoogleAccessToken(data.accessToken);
        setGoogleTokenExpiresAt(Date.now()+data.expiresIn*1000);
        return true;
      }
      setGoogleAccessToken(null);
      setGoogleTokenExpiresAt(null);
      return false;
    }).catch(()=>false);
  },[]);
  useEffect(()=>{
    if(googleTokenExpiresAt&&Date.now()>=googleTokenExpiresAt-5*60*1000) refreshGoogleToken();
    const interval=setInterval(()=>{
      if(googleAccessToken&&googleTokenExpiresAt&&Date.now()>=googleTokenExpiresAt-5*60*1000) refreshGoogleToken();
    },5*60*1000);
    return ()=>clearInterval(interval);
  },[googleAccessToken,googleTokenExpiresAt,refreshGoogleToken]);

  // Persist tracking state so banner survives page reload (e.g. returning from Maps app)
  useEffect(()=>{
    try{
      if(trackingMiles) localStorage.setItem('pmtf_tracking',JSON.stringify(trackingMiles));
      else localStorage.removeItem('pmtf_tracking');
    }catch{}
  },[trackingMiles]);

  // On mount: if there was an active tracking session, restart the GPS watch
  useEffect(()=>{
    const saved=trackingRef.current;
    if(!saved||!navigator.geolocation) return;
    // Resume GPS watch — distance will accumulate from where we left off
    const wid=navigator.geolocation.watchPosition(
      newPos=>{
        const prev=trackingRef.current;
        if(!prev||!prev.lastPos) return;
        const R=3958.8;
        const dLat=(newPos.coords.latitude-prev.lastPos.lat)*Math.PI/180;
        const dLon=(newPos.coords.longitude-prev.lastPos.lon)*Math.PI/180;
        const a=Math.sin(dLat/2)**2+Math.cos(prev.lastPos.lat*Math.PI/180)*Math.cos(newPos.coords.latitude*Math.PI/180)*Math.sin(dLon/2)**2;
        const dist=R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
        const updated={...prev,miles:prev.miles+dist,lastPos:{lat:newPos.coords.latitude,lon:newPos.coords.longitude}};
        trackingRef.current=updated;
        setTrackingMiles({...updated});
      },
      err=>console.warn('GPS resume error:',err),
      {enableHighAccuracy:true,maximumAge:0,timeout:10000}
    );
    watchIdRef.current=wid;
    // Cleanup on unmount
    return ()=>{ if(watchIdRef.current!=null) navigator.geolocation.clearWatch(watchIdRef.current); };
  },[]); // run once on mount

  const goHome=gig=>{
    if(!settings.homeAddress) return;
    setGigPopup(null);
    const dest=encodeURIComponent(settings.homeAddress);
    openWithFallback('comgooglemaps://?daddr='+dest+'&directionsmode=driving','https://www.google.com/maps/dir/?api=1&destination='+dest);
    setTimeout(()=>startTracking({...gig,venue:gig.venue+' to Home'}),800);
  };
  const closeModal=()=>setModal(null);
  const openAdd=(prefillDate)=>setModal({mode:'add',prefillDate});
  const openEdit=g=>setModal({mode:'edit',gig:g});
  // ── Google Sign-In (OAuth) for writing gigs to the shared calendar ──────
  // Uses a full-page redirect rather than a popup: popups can't hand control
  // back to a standalone/home-screen web app on iOS (there's no opener to
  // report to), which left users stranded on Google's page. A redirect just
  // navigates away and back, which works the same in standalone mode.
  const signInWithGoogle=()=>{
    if(showSettings) sessionStorage.setItem('pmtf_reopen_settings','1');
    const params=new URLSearchParams({
      client_id:GOOGLE_CLIENT_ID,
      redirect_uri:GOOGLE_REDIRECT_URI,
      response_type:'code',
      access_type:'offline',
      scope:CALENDAR_WRITE_SCOPE,
      include_granted_scopes:'true',
      // "consent" alone lets Google skip straight to a manual sign-in form
      // instead of showing the account picker (saved names/avatars) — this
      // still forces the consent screen every time (needed since we always
      // want a fresh refresh_token), but shows the picker first when there
      // are recognized signed-in Google sessions to choose from.
      prompt:'select_account consent'
    });
    window.location.href='https://accounts.google.com/o/oauth2/v2/auth?'+params.toString();
  };
  const signOutGoogle=()=>{
    fetch(FUNCTIONS_BASE_URL+'/revokeGoogleAuth',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({deviceId:getDeviceId()})
    }).catch(()=>{});
    setGoogleAccessToken(null);
    setGoogleTokenExpiresAt(null);
  };
  // Calls the Calendar API with the OAuth token to actually write an event.
  // Returns the created/updated event's Google id, or null on failure.
  // Returns {ok:true, id} (or {ok:true} for DELETE) on success, or
  // {ok:false, error} with a specific, human-readable reason on failure —
  // callers surface that exact reason instead of guessing why it failed.
  const writeGigToCalendar=async(method,g,googleEventId)=>{
    if(!googleAccessToken) return {ok:false,error:'Not signed in.'};
    if(!settings.calendarId){
      const error='No Calendar ID configured. Reopen Settings or reset the app to pick up the band\'s calendar.';
      setGoogleAuthError('Could not save to Google Calendar: '+error);
      return {ok:false,error};
    }
    const body={
      summary:g.venue,
      location:g.location||'',
      // The [PMTF_GIG] tag marks this event as written by the app itself, so
      // sync can trust it even without a location — the location requirement
      // below exists only to filter out unrelated personal notes on the
      // band's shared calendar (e.g. "Jim is off"), not app-created gigs.
      // Set time is stored here too, not just derived from the calendar's
      // real start/end clock time — a gig with a time is written as an
      // all-day event (see dateTime:null below), so a synced-back all-day
      // event has no clock time to derive from and would otherwise lose it.
      // Notes goes last since it's free text a person types — it could
      // contain a "·" itself, which would break parsing of the fields
      // above it if it came first. Everything after "Notes:" is taken
      // as-is on sync, so it's fine here.
      description:'[PMTF_GIG] Type: '+g.type+' · Status: '+g.status+(g.selfPA?' · PA: Self':'')+(g.time?' · Time: '+g.time:'')+(g.notes?' · Notes: '+g.notes:'')
    };
    if(g.time||method==='POST'){
      // Explicitly null out dateTime alongside date — PATCHing an event that
      // was originally created with a specific time (dateTime) over to an
      // all-day event (date) without clearing the old dateTime leaves both
      // set at once, which Google's API rejects as an invalid/ambiguous
      // start or end time.
      body.start={date:g.date,dateTime:null};
      body.end={date:g.date,dateTime:null};
    }
    // else: this gig has no time and we're editing an event that already
    // exists on the calendar — omit start/end entirely rather than forcing
    // it all-day. PATCH only touches fields present in the request body, so
    // leaving these out preserves whatever start/end (including a specific
    // clock time someone set directly on Google Calendar) is already there,
    // instead of silently erasing it just because this edit didn't touch time.
    const base=`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(settings.calendarId)}/events`;
    const url=method==='POST'?base:`${base}/${encodeURIComponent(googleEventId)}`;
    try{
      const res=await fetch(url,{
        method,
        headers:{'Authorization':'Bearer '+googleAccessToken,'Content-Type':'application/json'},
        body:method==='DELETE'?undefined:JSON.stringify(body)
      });
      if(!res.ok){
        const err=await res.json().catch(()=>({}));
        const error=err.error?.message||('HTTP '+res.status);
        setGoogleAuthError('Could not save to Google Calendar: '+error);
        return {ok:false,error};
      }
      if(method==='DELETE') return {ok:true};
      const data=await res.json();
      return {ok:true,id:data.id};
    }catch(err){
      const error='Could not reach Google Calendar. Check your connection.';
      setGoogleAuthError(error);
      return {ok:false,error};
    }
  };

  // A stale token looks identical to a valid one until an API call actually
  // fails — check the expiry we already track before ever attempting a
  // write, so we can tell the user right away instead of pretending success
  // and letting the next auto-sync silently erase the change later.
  const isGoogleTokenExpired=()=>googleTokenExpiresAt&&Date.now()>=googleTokenExpiresAt;
  const clearExpiredGoogleAuth=()=>{setGoogleAccessToken(null);setGoogleTokenExpiresAt(null);};

  const saveGig=async g=>{
    if(googleAccessToken){
      if(isGoogleTokenExpired()){
        clearExpiredGoogleAuth();
        alert('Your Google sign-in expired, so this didn\'t save to the shared calendar. Sign in again under Settings → Calendar, then make this change again.');
        if(g.fromCalendar){closeModal();return;} // don't apply an edit that wasn't actually saved
      } else {
        const isNewFromCalendar=!g.fromCalendar;
        const result=await writeGigToCalendar(g.fromCalendar?'PATCH':'POST',g,g.fromCalendar?g.id:null);
        if(result.ok){
          g={...g,fromCalendar:true,id:isNewFromCalendar?result.id:g.id};
        } else if(g.fromCalendar){
          // Write failed for an edit to an already-shared gig — don't apply it
          // locally either, since the next sync would just revert it anyway
          // with no explanation. Better to be upfront that it didn't save.
          alert('Could not save this change to the shared calendar. Your edit was not applied.\n\nReason: '+result.error);
          closeModal();
          return;
        }
      }
    }
    setGigs(p=>p.find(x=>x.id===g.id)?p.map(x=>x.id===g.id?g:x):[...p,g]);
    // Broadcast to every other device via Firestore, regardless of Google
    // sign-in state — this is what makes a newly-added gig show up
    // everywhere instantly instead of waiting on the next calendar sync.
    const{id:_gid,...gigBody}=g;
    db.collection('gigs').doc(String(g.id)).set(gigBody).catch(()=>{});
    closeModal();
  };
  const deleteGig=async id=>{
    const target=gigs.find(x=>x.id===id);
    if(googleAccessToken&&target?.fromCalendar){
      if(isGoogleTokenExpired()){
        clearExpiredGoogleAuth();
        alert('Your Google sign-in expired, so this wasn\'t deleted from the shared calendar. Sign in again under Settings → Calendar, then delete it again.');
        closeModal();
        return;
      }
      const result=await writeGigToCalendar('DELETE',target,id);
      if(!result.ok){
        alert('Could not delete this from the shared calendar. It was not removed.\n\nReason: '+result.error);
        closeModal();
        return;
      }
    }
    setGigs(p=>p.filter(x=>x.id!==id));
    db.collection('gigs').doc(String(id)).delete().catch(()=>{});
    closeModal();
  };

  const syncFromGoogleCalendar=async(silent=false)=>{
    if(!settings.calendarId){
      if(!silent)alert('Add your Google Calendar ID in Settings → Calendar first.');
      return;
    }
    setCalSyncing(true);
    try{
      const now=new Date();
      const start=new Date(now.getFullYear(),0,1).toISOString();
      const end=new Date(now.getFullYear(),11,31).toISOString();
      const url=`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(settings.calendarId)}/events?key=${GOOGLE_API_KEY}&timeMin=${start}&timeMax=${end}&singleEvents=true&orderBy=startTime&maxResults=100`;
      const res=await fetch(url);
      const data=await res.json();
      if(!res.ok){
        if(!silent)alert('Could not sync calendar: '+(data.error?.message||'check that the Calendar ID is correct and the calendar is public.'));
        setCalSyncing(false);
        return;
      }
      if(data.items&&data.items.length>0){
        const calGigs=data.items.map(ev=>{
          const date=ev.start?.date||ev.start?.dateTime?.slice(0,10)||'';
          if(!date) return null;
          // Require a location for events we didn't create ourselves — that's
          // what keeps unrelated personal notes on the shared calendar (e.g.
          // "Jim is off") from showing up as fake gigs. Gigs the app wrote
          // itself are tagged and trusted regardless, since a real gig added
          // in the app might not have a location filled in yet.
          const isAppManaged=(ev.description||'').includes('[PMTF_GIG]');
          if(!ev.location&&!isAppManaged) return null;
          // Prefer the time stored in the description tag — every gig is
          // written as an all-day event, so it has no real clock time to
          // derive here; only fall back to deriving from dateTime for
          // genuinely external events we didn't tag ourselves.
          const timeTag=(ev.description||'').match(/Time:\s*([^·]+)/);
          let time=timeTag?timeTag[1].trim():'';
          if(!time){
            const ts=ev.start?.dateTime?new Date(ev.start.dateTime).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
            const te=ev.end?.dateTime?new Date(ev.end.dateTime).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
            time=ts&&te?`${ts}–${te}`:ts;
          }
          const venue=ev.summary||'Untitled';
          const selfPA=(ev.description||'').includes('PA: Self');
          // Notes is written last and takes everything after it as-is, since
          // it's free text that could itself contain "·".
          const notesTag=(ev.description||'').match(/Notes:\s*([\s\S]*)$/);
          const notes=notesTag?notesTag[1].trim():'';
          return{id:ev.id,date,venue,location:ev.location||'',type:venue.toLowerCase().includes('wedding')?'wedding':'bar',status:'confirmed',time,fromCalendar:true,selfPA,notes};
        }).filter(Boolean);
        // Only replace calendar-sourced gigs; keep manually-added local gigs untouched.
        // Also drop any local gig that matches one just synced (same date+venue) —
        // phones with gigs saved from before fromCalendar tagging existed would
        // otherwise never get filtered out above, and every matching date would
        // show the same gig twice forever.
        const dedupeKey=g=>g.date+'|'+(g.venue||'').trim().toLowerCase();
        const calKeys=new Set(calGigs.map(dedupeKey));
        setGigs(prev=>{
          // A gig marked unpaid before it ever synced to the real Google
          // Calendar gets superseded right here by its calendar-sourced
          // counterpart, which carries Google's own event id instead of the
          // local one — otherwise-identical gig, brand new id. Remap any
          // unpaid mark onto that new id so it isn't silently lost the next
          // time the app opens and this sync runs again.
          const calByKey=new Map(calGigs.map(g=>[dedupeKey(g),g]));
          const idRemap=new Map();
          prev.forEach(g=>{
            if(!g.fromCalendar&&calKeys.has(dedupeKey(g))){
              const matched=calByKey.get(dedupeKey(g));
              if(matched) idRemap.set(g.id,matched.id);
            }
          });
          if(idRemap.size) setUnpaidGigIds(ids=>ids.map(id=>idRemap.has(id)?idRemap.get(id):id));
          // notes/type/status/selfPA are re-derived here by parsing them back
          // out of the calendar event's description text — but that text is
          // only ever updated while the editing device is signed into Google
          // Calendar. A note saved locally from a signed-out device would
          // otherwise get silently wiped the next time this runs (every time
          // the app is reopened) since Calendar's own copy never had it.
          // Keep whatever this device already has for those fields; only
          // date/venue/location/time actually come from Calendar itself.
          const prevById=new Map(prev.map(g=>[String(g.id),g]));
          const mergedCalGigs=calGigs.map(cg=>{
            const existing=prevById.get(String(cg.id));
            if(!existing)return cg;
            return{...cg,notes:existing.notes,type:existing.type,status:existing.status,selfPA:existing.selfPA};
          });
          return [...prev.filter(g=>!g.fromCalendar&&!calKeys.has(dedupeKey(g))),...mergedCalGigs];
        });
        setLastSynced(new Date().toLocaleTimeString());
      } else if(!silent){
        alert('No events found on that calendar for this year.');
      }
    }catch(err){
      if(!silent)alert('Could not sync calendar. Check your connection and try again.');
    }
    setCalSyncing(false);
  };

  // Automatically sync from the band's calendar every time the app opens,
  // so gigs someone else added show up without needing to tap Sync manually.
  useEffect(()=>{
    syncFromGoogleCalendar(true);
  },[]);

  // Also re-sync whenever the app comes back into view — switching back to
  // a home-screen app on iOS often just resumes the existing page instead
  // of reloading it, so a mount-only sync alone wouldn't catch that case.
  useEffect(()=>{
    const onVisible=()=>{ if(document.visibilityState==='visible') syncFromGoogleCalendar(true); };
    document.addEventListener('visibilitychange',onVisible);
    return ()=>document.removeEventListener('visibilitychange',onVisible);
  },[]);

  // ── FIXED: Mileage tracking ──────────────────────────────────────────────
  // Sets state FIRST so banner appears immediately, then starts GPS watch.
  // Uses a ref for the distance accumulator so the watchPosition callback
  // never closes over stale state (the root cause of the invisible banner).
  const startTracking=gig=>{
    if(!navigator.geolocation){
      alert('GPS not available on this device.');
      return;
    }

    // Set tracking state immediately so the banner renders right away
    const initialState={
      gigId:gig.id,
      venueName:gig.venue,
      date:gig.date,
      miles:0,
      lastPos:null,  // will be set on first GPS fix
    };
    setTrackingMiles(initialState);
    trackingRef.current=initialState;

    // Get initial position, then start watch
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const startPos={lat:pos.coords.latitude,lon:pos.coords.longitude};
        const withPos={...trackingRef.current,lastPos:startPos};

                      // The edit pencil now lives on your own roster row
                      // above (a real button there, with your name right
                      // next to it) — no need to repeat your name or a
                      // second edit control down here.
                      e('div',{style:{fontSize:11.5,color:theme.primary,fontWeight:600,marginBottom:7}},'Your response'),
                      e('div',{style:{display:'flex',gap:6}},
                        ['yes','maybe','no'].map(v=>{
                          const mine=gigResponses[settings.memberName]===v;
                          const s=RSVP_STYLE[v];
                          return e('button',{key:v,onClick:()=>{respondToGig(gigPopup.id,v);setEditingResponse(false);},
                            style:{flex:1,padding:'7px 0',borderRadius:8,border:'1.5px solid '+(mine?s.color:'#e5e7eb'),
                              background:mine?s.bg:'#fff',color:mine?s.color:'#6b7280',fontWeight:600,fontSize:12,cursor:'pointer'}
                          },s.label);
                        })
                      )
                    )
            )
          )
        ),
        e('div',{style:{display:'flex',gap:8,flexDirection:'column'}},
          // Icon-only now, not full-width labeled buttons — these matter
          // less than the response buttons above, so they get less visual
          // weight. title= keeps a text label available on hover/long-press.
          e('div',{style:{display:'flex',gap:8}},
            gigPopup.location&&e('button',{onClick:()=>{setAskTrack(gigPopup);setGigPopup(null);},title:'Map',
              style:{flex:1,padding:'9px 0',borderRadius:10,background:'#E0EFFE',color:'#1D4ED8',fontWeight:500,border:'none',cursor:'pointer',fontSize:16}},'📍'),
            settings.homeAddress&&e('button',{onClick:()=>goHome(gigPopup),title:'Home',
              style:{flex:1,padding:'9px 0',borderRadius:10,background:'#E1F5EE',color:'#0F6E56',fontWeight:500,border:'none',cursor:'pointer',fontSize:16}},'🏠'),
            e('button',{onClick:()=>{setGigPopup(null);openEdit(gigPopup);},title:'Edit',
              style:{flex:1,padding:'9px 0',borderRadius:10,background:theme.mid,color:'#fff',border:'none',fontWeight:500,cursor:'pointer',fontSize:16}},'✏️'),
            e('button',{onClick:()=>{if(window.confirm('Delete "'+gigPopup.venue+'"?')){const id=gigPopup.id;setGigPopup(null);deleteGig(id);}},title:'Delete',
              style:{flex:'0 0 42px',padding:'9px 0',borderRadius:10,background:'#FEE2E2',color:'#B91C1C',border:'none',cursor:'pointer',fontSize:16}},'🗑️')
          ),
          !settings.homeAddress&&e('div',{style:{fontSize:11,color:'#9ca3af',textAlign:'center',paddingTop:2}},'Set a home address in Settings to enable the Home button'),
          e('button',{onClick:()=>{const d=gigPopup.date;setGigPopup(null);openAdd(d);},
            style:{padding:'9px 0',borderRadius:10,border:'1px solid #d1d5db',background:'#fff',color:'#374151',fontWeight:500,cursor:'pointer',fontSize:14}},'+ Add another gig this day')
        )
      )
    ),

    // ── "Track miles?" confirmation modal ───────────────────────────────────
    askTrack&&e('div',{onClick:()=>setAskTrack(null),className:'overlay'},
      e('div',{onClick:ev=>ev.stopPropagation(),className:'modal',style:{maxWidth:360}},
        e('div',{style:{fontSize:16,fontWeight:500,marginBottom:6}},'Track miles for this trip?'),
        e('div',{style:{fontSize:13,color:'#6b7280',marginBottom:20}},
          "We'll use GPS to track your mileage. A banner will appear so you can stop tracking when you arrive."
        ),
        e('div',{style:{display:'flex',gap:8}},
          // Skip: just open Maps, no tracking
          e('button',{
            onClick:()=>{
              openMaps(askTrack.venue,askTrack.location);
              setAskTrack(null);
            },
            style:{flex:1,padding:'9px 0',borderRadius:10,border:'1px solid #d1d5db',cursor:'pointer',fontSize:14}
          },'Skip'),
          // Track: start tracking FIRST, then open Maps
          e('button',{
            onClick:()=>{
              const gig=askTrack;
              setAskTrack(null);             // close modal
              openMaps(gig.venue,gig.location); // open Maps immediately
              setTimeout(()=>startTracking(gig),800); // start GPS after Maps launches
            },
            style:{flex:1,padding:'9px 0',borderRadius:10,background:theme.mid,color:'#fff',border:'none',fontWeight:500,cursor:'pointer',fontSize:14}
          },'Yes, track')
        )
      )
    ),

    // ── Persistent tracking banner ─────────────────────────────────────────
    trackingMiles&&e('div',{style:{
      position:'fixed',bottom:20,left:'50%',transform:'translateX(-50%)',
      width:'min(380px,92vw)',background:'#fff',borderRadius:14,
      padding:'12px 16px',
      boxShadow:'0 4px 24px rgba(0,0,0,0.18)',
      border:`2px solid ${theme.mid}`,
      display:'flex',alignItems:'center',justifyContent:'space-between',
      gap:12,zIndex:9999  // raised z-index so it's always on top
    }},
      e('div',{style:{display:'flex',alignItems:'center',gap:10}},
        e('div',{
          className:'tracking-dot',
          style:{width:10,height:10,borderRadius:'50%',background:'#22c55e',flexShrink:0}
        }),
        e('div',null,
          e('div',{style:{fontSize:13,fontWeight:600,color:'#111827'}},'Tracking miles'),
          e('div',{style:{fontSize:12,color:'#6b7280',marginTop:1}},
            trackingMiles.venueName+' · '+(trackingMiles.miles||0).toFixed(1)+' mi'
          )
        )
      ),
      e('button',{
        onClick:stopTracking,
        style:{background:'#dc2626',color:'#fff',border:'none',borderRadius:8,padding:'8px 18px',cursor:'pointer',fontWeight:600,fontSize:14,flexShrink:0}
      },'⏹ Stop')
    ),

    // Real <a> tag, not a scripted window.open() — that doesn't reliably
    // hand off to Safari from inside an installed iOS home-screen app. The
    // x-safari- URL scheme prefix (see the matching home-address link above)
    // forces an actual Safari hand-off instead of a same-URL no-op.
    gpsStandaloneHelp&&e('div',{style:{
      position:'fixed',bottom:20,left:'50%',transform:'translateX(-50%)',
      width:'min(380px,92vw)',background:'#fff',borderRadius:14,
      padding:'12px 16px',boxShadow:'0 4px 24px rgba(0,0,0,0.18)',
      border:'2px solid #dc2626',display:'flex',flexDirection:'column',gap:8,zIndex:9999
    }},
      e('div',{style:{fontSize:12.5,color:'#374151',lineHeight:1.4}},
        'Mileage tracking needs location access, which doesn\'t work reliably in the installed app on iPhone — an Apple limitation. Open this page in Safari to track mileage there instead.'
      ),
      e('div',{style:{display:'flex',gap:8}},
        e('a',{href:'x-safari-'+window.location.href,target:'_blank',rel:'noopener',onClick:()=>setGpsStandaloneHelp(false),
          style:{flex:1,textAlign:'center',padding:'8px 0',borderRadius:8,background:theme.mid,color:'#fff',fontWeight:600,fontSize:13,textDecoration:'none'}},
          '↗ Open in Safari'),
        e('button',{onClick:()=>setGpsStandaloneHelp(false),
          style:{padding:'8px 14px',borderRadius:8,border:'0.5px solid #d1d5db',background:'#fff',color:'#374151',cursor:'pointer',fontSize:13,fontWeight:500}},
          'Dismiss')
      )
    ),
    e(PrintStandaloneBanner,{show:setlistPrintStandaloneHelp,onDismiss:()=>setSetlistPrintStandaloneHelp(false),theme}),
    e(PrintStandaloneBanner,{show:songPrintStandaloneHelp,onDismiss:()=>setSongPrintStandaloneHelp(false),theme}),

    bandMessageModal&&e(BandMessageModal,{
      message:bandMessageModalTarget,onClose:()=>setBandMessageModal(null),
      onSave:saveBandMessageModal,onDelete:deleteBandMessageModal
    }),

    confirmDelete&&members.filter(m=>m.id===confirmDelete).map(m=>
      e('div',{key:'confirm',onClick:()=>setConfirmDelete(null),className:'overlay'},
        e('div',{onClick:ev=>ev.stopPropagation(),className:'modal',style:{maxWidth:360}},
          e('div',{style:{fontSize:16,fontWeight:600,marginBottom:8}},`Remove ${m.name}'s checklist?`),
          e('div',{style:{fontSize:13,color:'#6b7280',marginBottom:20}},`This will permanently delete ${m.name} and all their items. This cannot be undone.`),
          e('div',{style:{display:'flex',gap:8,justifyContent:'flex-end'}},
            e('button',{onClick:()=>setConfirmDelete(null)},'Cancel'),
            e('button',{onClick:()=>deleteMember(m.id),style:{background:'#dc2626',color:'#fff',border:'none',borderRadius:8,padding:'6px 16px',cursor:'pointer',fontWeight:500}},'Remove')
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
